# Cron endpoints that need to run more often than Vercel's Hobby plan allows
# (Hobby's floor is once per day). Pings the same routes Vercel would, using the
# CRON_SECRET bearer the routes already verify.
#
# CADENCE — READ THIS BEFORE RELYING ON IT. The schedule below asks for every 5
# minutes. GitHub does not deliver that: `schedule` is best-effort and is
# throttled hard. Measured over 2026-08-09T14:46Z → 2026-08-11T04:41Z, 40 runs
# fired against 455 requested — 8.8% delivery, median gap 51 minutes, worst
# observed gap 124 minutes. So treat this as "roughly hourly, sometimes worse",
# NOT as a 5-minute scheduler. Anything that genuinely needs minute-level
# latency needs a real scheduler (Vercel Pro crons, or an external trigger).
#
# If the account upgrades to Vercel Pro, move these schedules into vercel.json
# "crons" and delete this file — but note that process-communications and
# reconcile-payments ALSO have daily entries in vercel.json as an outage
# backstop, so remove those at the same time or they will double-invoke.
name: sub-daily-crons
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      # One step, so a failure in the first endpoint cannot silently skip the
      # rest. Every endpoint is pinged, then the step fails if any did not
      # return 2xx.
      #
      # The old form ended each curl with `|| echo "... (non-fatal)"`, which
      # turned every 401/500 into exit 0. The run went green whether or not the
      # work happened — so the single failure it most needed to surface, a
      # CRON_SECRET that drifted out of sync with Vercel's, was invisible
      # forever. That is the exact outage this workflow exists to prevent.
      #
      # The secret goes through `env:`, never interpolated into the script text.
      - name: Ping sub-daily cron endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://ai-hvac-agent-lovat.vercel.app
        run: |
          set -uo pipefail
          failed=""
          for endpoint in process-communications delay-sweep reconcile-payments; do
            code=$(curl -sS -m 60 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/cron/$endpoint" || echo "000")
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ]; then
              echo "ok   $endpoint ($code)"
            else
              echo "FAIL $endpoint ($code)"
              failed="$failed $endpoint"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::sub-daily cron pings failed:$failed"
            exit 1
          fi
